    <script>
      // Single Page Apps for GitHub Pages (MIT, rafgraph) : public/404.html redirige
      // /projets/x vers /?/projets/x, ce script restaure l'URL avant le routeur.
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>

<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Boualem El Guendouz — Portfolio</title>
    <script>
      // Single Page Apps for GitHub Pages (MIT, rafgraph) :
      // /portfolio/projets/x -> /portfolio/?/projets/x, puis index.html restaure l'URL pour le routeur.
      var segmentCount = 1;
      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
          l.pathname.split("/").slice(0, 1 + segmentCount).join("/") +
          "/?/" +
          l.pathname.slice(1).split("/").slice(segmentCount).join("/").replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
